<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dedicated LIGHT-BACKGROUND logo: baked colors for contexts where
       currentColor cannot inherit (object/img embeds, OS surfaces, installer). -->
