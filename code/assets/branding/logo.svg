<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Grindstone placeholder mark: equilateral triangle, slow continuous spin.
       Theme-aware: inherits currentColor. Use .no-spin (or prefers-reduced-motion)
       for the static frame; .ico is generated from the static render. -->
  <style>
    .gs-mark { transform-origin: 32px 32px; animation: gs-spin 7s linear infinite; }
    @keyframes gs-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gs-mark { animation: none; } }
  </style>
  <g class="gs-mark" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M32 10 L51.05 43 L12.95 43 Z"/>
    <path d="M32 41 L24.2 27.5 L39.8 27.5 Z" fill="currentColor" stroke="none" opacity="0.4"/>
  </g>
</svg>
